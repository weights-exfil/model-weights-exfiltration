<svg viewBox="0 0 720 236" role="img"
     aria-label="Inference verification. The compromised inference server sends its output to a verifier that holds the same weights and seed. Two rows compare them: the served row reads 'the light came at morning', and the prescribed row, what an honest server would have produced, reads 'the light came at dawn'. The first four words match; the final word differs — morning versus dawn — and that mismatch is a flip, the signature of a possible attack."
     style="width:100%;height:auto;display:block;font-family:var(--font-ui);">

  <!-- Ported from the symposium talk's served-vs-prescribed figure into the blog's
       theme-aware grammar. --caught (red) = the compromised server and its served
       token; --ok (CVD-safe teal-green) = the verifier and the prescribed token.
       The four shared cover words are muted; only the last token differs = a flip. -->

  <defs>
    <marker id="vfy-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--caught)"/>
    </marker>
  </defs>

  <!-- ═══ the two machines ═══════════════════════════════════════════════ -->
  <rect x="40" y="16" width="280" height="62" rx="8"
        fill="var(--surface)" stroke="var(--caught)" stroke-width="2"/>
  <text x="180" y="44" text-anchor="middle" font-size="13" font-weight="700"
        letter-spacing="0.04em" fill="var(--caught)">INFERENCE SERVER</text>
  <text x="180" y="63" text-anchor="middle" font-size="11" fill="var(--muted)">compromised</text>

  <line x1="326" y1="47" x2="392" y2="47" stroke="var(--caught)" stroke-width="2.5"
        marker-end="url(#vfy-arrow)"/>

  <rect x="400" y="16" width="280" height="62" rx="8"
        fill="var(--surface)" stroke="var(--ok)" stroke-width="2"/>
  <text x="540" y="44" text-anchor="middle" font-size="13" font-weight="700"
        letter-spacing="0.04em" fill="var(--ok)">VERIFIER</text>
  <text x="540" y="63" text-anchor="middle" font-size="11" fill="var(--muted)">same weights + seed</text>

  <!-- ═══ served row ═════════════════════════════════════════════════════ -->
  <text x="24" y="136" font-size="12" font-weight="600" fill="var(--caught)">served</text>
  <g font-size="12">
    <rect x="120" y="112" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="150" y="137" text-anchor="middle" fill="var(--muted)">the</text>
    <rect x="186" y="112" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="216" y="137" text-anchor="middle" fill="var(--muted)">light</text>
    <rect x="252" y="112" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="282" y="137" text-anchor="middle" fill="var(--muted)">came</text>
    <rect x="318" y="112" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="348" y="137" text-anchor="middle" fill="var(--muted)">at</text>
    <rect x="392" y="112" width="104" height="40" rx="5" fill="var(--surface)" stroke="var(--caught)" stroke-width="2.4"/>
    <text x="444" y="137" text-anchor="middle" font-weight="700" fill="var(--caught)">morning</text>
  </g>

  <!-- ═══ prescribed row ═════════════════════════════════════════════════ -->
  <text x="24" y="204" font-size="12" font-weight="600" fill="var(--ok)">prescribed</text>
  <g font-size="12">
    <rect x="120" y="180" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="150" y="205" text-anchor="middle" fill="var(--muted)">the</text>
    <rect x="186" y="180" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="216" y="205" text-anchor="middle" fill="var(--muted)">light</text>
    <rect x="252" y="180" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="282" y="205" text-anchor="middle" fill="var(--muted)">came</text>
    <rect x="318" y="180" width="60" height="40" rx="5" fill="var(--surface)" stroke="var(--rule)" stroke-width="1.4"/>
    <text x="348" y="205" text-anchor="middle" fill="var(--muted)">at</text>
    <rect x="392" y="180" width="104" height="40" rx="5" fill="var(--surface)" stroke="var(--ok)" stroke-width="2.4"/>
    <text x="444" y="205" text-anchor="middle" font-weight="700" fill="var(--ok)">dawn</text>
  </g>
</svg>
