# GitHub Pages / Jekyll config.
#
# Deliberately theme-less: `theme:` is unset, so Jekyll uses our own
# _layouts/default.html and assets/css/style.css instead of importing
# minima's markup and typography. Removing this comment and adding a theme
# would silently override the page design.

title: "Hiding data in an LLM's word choices"
description: "A compromised inference server can encode secrets in which token it emits. How much leaks, and what bounds it."

# Served as a GitHub Pages project site at <org>.github.io/<repo>/, so baseurl
# must be the repo path or every absolute-root asset (the stylesheet, etc.) 404s.
url: "https://weights-exfil.github.io"
baseurl: "/model-weights-exfiltration"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# The recorded demo is a static bundle copied in at docs/demo/. Jekyll must
# not try to process it — it is pre-built HTML + JSON traces.
keep_files:
  - demo

exclude:
  - README.md

plugins:
  - jekyll-sitemap
